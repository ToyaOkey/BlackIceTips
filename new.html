<body>
    <header>
        <!-- <h1>Black Ice Tips</h1> -->
        <div class="img-container">
            <a href="index.html"><img src="images/Logo.svg" alt="Black Ice Tips Logo" id="logo"></a>
        </div>
        
        <div class="input-box">
            <input type="text" placeholder="search">

            <div class="search-container">
                <a href="#"><img src="images/search-icon.svg" alt="Search bar icon" id="search-icon" width="25" ></a>
            </div>
            
        </div>
        <nav>

            <ul>
                <li><a href ="items.html">Browse</a></li>
                <li><a href="new.html">Sell</a></li>
                <li id="login"><a href="#">Login</a></li>
                <li id="signup"><a href="#">Sign Up</a></li>
            </ul>
        </nav>
    </header>
    <main>
       <div class="form-container">
        <h1>Sell Form</h1>
        <p>Fill out this form in order to sell a product. This will be reviewed by an expert.</p>
       
       <form action="#">
            <div class="row">
                <div class="column">
                    <label for="condition-dropdown">Condition</label>
                    <select name="condition-dropdown" id="condition-dropdown" required>
                        <option value="" disabled selected>Select a Condition</option>
                        <option value="beginner">Beginner</option>
                        <option value="intermediate">Intermediate</option>
                        <option value="advanced">Advanced</option>
                        <option value="expert">Expert</option>
                    </select>
                </div>
                <div class="column">
                    <label for="price">Price</label>
                    <input type="number" id="price" name="price" placeholder="Enter price" required>
                </div>
            </div>
            <div class="row">
                <div class="column">
                    <label for="title">Title</label> 
                    <input type="text" id="title" name="title" placeholder="Enter product name" required>   
                </div>
                <div class="column">
                    <label for="seller">Seller</label> 
                    <input type="text" id="seller" name="seller" placeholder="Enter seller name" required>   
                </div>
            </div>
            <div class="row">
                <div class="column">
                    <label for="Details">Details</label>
                    <textarea name="Details" id="Details" cols="40" rows="5" placeholder="Enter description" required></textarea>
                </div>
                <div class="column">
                    <label for="file-upload" class = "file-upload">Image</label>
                    <input type="file" id="file-upload" name="image" accept="image/*" required>
                </div>

            </div>
            <button>Submit</button>
       </form>
    </div>
    </main>
    <footer>
        <p>©2024  Black Ice Tips. All rights reserved.</p>

            <a href="https://www.linkedin.com/in/toyaokey/" target="_blank"><img src="images/linkedin-logo.svg" alt="LinkedIn" height="40" width = "40"></a>
        </div>
    </footer>
